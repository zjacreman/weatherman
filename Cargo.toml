[package]
name = "weatherman"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "native-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
anyhow = "1"
toml = "0.8"

[dev-dependencies]
# https://crates.io/crates/unicode-width — measure terminal display width to assert weather icon alignment (same crate ratatui uses for layout)
unicode-width = "0.2"
